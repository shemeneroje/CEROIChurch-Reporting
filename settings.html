<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="javascripts/auth.js"></script>
</head>
<body class="home">
    <nav class="navbar">
        <div class="logo">
            <a href="home.html"><strong>Church Reporting</strong></a>
        </div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="reports.html">Reports</a>
            <a href="settings.html" class="active">Settings</a>

        <div class="container" style="margin-top:5em;">
            <section class="profile-section">

                    <div><strong>Surname:</strong> <span id="profile-surname">Loading…</span></div>
                    <div><strong>Zone:</strong> <span id="profile-zone">Loading…</span></div>
                    <div><strong>Chapter:</strong> <span id="profile-chapter">Loading…</span></div>
                    <div><strong>Church:</strong> <span id="profile-church">Loading…</span></div>
                    <div><strong>Designation:</strong> <span id="profile-designation">Loading…</span></div>
                    <div><strong>Email Address:</strong> <span id="profile-email">Loading…</span></div>
                    <div><strong>Phone Number:</strong> <span id="profile-phone">Loading…</span></div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
