<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Church Report History</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="javascripts/church-history.js"></script>
    <script type="module" src="javascripts/role-access.js"></script>
    
</head>
<body>
    <nav class="navbar">
        <div class="logo"><a href="home.html"><strong>Church Reporting</strong></a></div>
        <div class="menu">
            <a href="home.html">Home</a>
            <a href="church-history.html" class="active">Church History</a>
            <a href="reports.html">Record Giving</a>
            <button class="button logout" id="logout-btn">Logout</button>
        </div>
    </nav>

    <main>
        <div class="container" style="margin-top:5em;">
            <h1>Church Giving History</h1>

            <div class="form-group">
                <label for="start-date">Start Date</label>
                <input type="date" id="start-date" required>
            </div>

            <div class="form-group">
                <label for="end-date">End Date</label>
                <input type="date" id="end-date" required>
            </div>

            <button id="generate-btn" class="button download">Generate & Download CSV</button>

            <div id="history-table" class="reports-section" style="margin-top:16px;"></div>
        </div>
    </main>
</body>
</html>
